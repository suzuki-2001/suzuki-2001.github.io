<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Pixel-art coffee cup favicon -->
  <rect x="0" y="0" width="16" height="16" fill="#1e1a16"/>
  <!-- Cup body -->
  <rect x="3" y="6" width="8" height="8" fill="#d4a574"/>
  <rect x="4" y="7" width="6" height="6" fill="#2d2520"/>
  <!-- Handle -->
  <rect x="11" y="8" width="2" height="4" fill="#d4a574"/>
  <rect x="12" y="9" width="1" height="2" fill="#1e1a16"/>
  <!-- Steam -->
  <rect x="5" y="3" width="1" height="2" fill="#f5e6d3"/>
  <rect x="7" y="2" width="1" height="3" fill="#f5e6d3"/>
  <rect x="9" y="3" width="1" height="2" fill="#f5e6d3"/>
</svg>
